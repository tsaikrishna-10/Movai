<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#11001C" />
  <title>MOVAI — Cinema Streaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #11001C;
      --bg-elevated: #1A0129;
      --glass-surface: rgba(34, 1, 53, 0.62);
      --glass-surface-hover: rgba(58, 2, 91, 0.72);
      --glass-border: rgba(255, 255, 255, 0.14);
      --accent-primary: #520380;
      --accent-secondary: #3A025B;
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.72);
      --text-muted: rgba(255, 255, 255, 0.48);
      --gold-rating: #F6C85F;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 12% 8%, rgba(82, 3, 128, 0.42) 0%, transparent 48%),
        radial-gradient(circle at 88% 18%, rgba(58, 2, 91, 0.36) 0%, transparent 52%),
        radial-gradient(circle at 50% 82%, rgba(34, 1, 53, 0.35) 0%, transparent 60%),
        var(--bg-canvas);
    }

    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 16px 112px;
    }

    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .user-greeting {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar-ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--accent-primary), rgba(255, 255, 255, 0.35));
      flex-shrink: 0;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: var(--bg-elevated);
    }

    .greeting-name {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions-pill {
      display: inline-flex;
      align-items: center;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 999px;
      padding: 4px;
      gap: 2px;
      flex-shrink: 0;
    }

    .header-pill-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: var(--text-primary);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .header-pill-btn:active {
      transform: scale(0.94);
      background: var(--glass-surface-hover);
    }

    .notif-dot {
      position: absolute;
      top: 9px;
      right: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #C084FC;
      box-shadow: 0 0 8px #C084FC;
    }

    .category-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
      margin-bottom: 18px;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      border: 1px solid var(--glass-border);
      background: var(--glass-surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-pill.active {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-color: rgba(255, 255, 255, 0.28);
      color: #FFFFFF;
      box-shadow: 0 8px 22px rgba(82, 3, 128, 0.45);
    }

    .featured-card {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      background: var(--bg-elevated);
      aspect-ratio: 16 / 11;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.55);
      margin-bottom: 24px;
      cursor: pointer;
    }

    .featured-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .featured-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(17, 0, 28, 0.08) 0%, rgba(17, 0, 28, 0.35) 48%, rgba(17, 0, 28, 0.94) 100%),
        linear-gradient(90deg, rgba(17, 0, 28, 0.72) 0%, transparent 65%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 18px;
    }

    .featured-tag {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(82, 3, 128, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      margin-bottom: 8px;
    }

    .featured-title {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .featured-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .watch-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      padding: 7px 14px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .section-block {
      margin-bottom: 24px;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .poster-rail {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 126px;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .poster-rail::-webkit-scrollbar {
      display: none;
    }

    .poster-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .poster-card:active {
      transform: scale(0.97);
    }

    .poster-thumb {
      aspect-ratio: 2 / 3;
      width: 100%;
      object-fit: cover;
      display: block;
      background: var(--bg-elevated);
    }

    .poster-info {
      padding: 8px 9px 10px;
    }

    .poster-name {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .poster-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .star {
      color: var(--gold-rating);
      font-weight: 700;
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 11px 14px;
      margin-bottom: 16px;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .profile-card {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .bottom-dock-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 16px;
      z-index: 40;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      pointer-events: none;
    }

    .bottom-dock {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(34, 1, 53, 0.78);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65);
    }

    .dock-btn {
      height: 44px;
      min-width: 44px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .dock-btn span {
      display: none;
      white-space: nowrap;
    }

    .dock-btn.active {
      background: #FFFFFF;
      color: #11001C;
      padding: 0 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .dock-btn.active span {
      display: inline;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(17, 0, 28, 0.82);
      backdrop-filter: blur(12px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .player-sheet {
      width: 100%;
      max-width: 520px;
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      border-bottom: 0;
      border-radius: 28px 28px 0 0;
      padding: 16px 16px 28px;
      box-shadow: 0 -16px 48px rgba(0, 0, 0, 0.75);
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      margin: 0 auto 14px;
    }

    .player-screen {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--glass-border);
      margin-bottom: 14px;
    }

    .player-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.65;
    }

    .player-center-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.32);
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-primary {
      flex: 1;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-ghost {
      height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--glass-surface);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      z-index: 80;
      background: var(--bg-elevated);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s ease;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="toast" id="toast"></div>

  <div class="app-shell">
    <header class="top-header">
      <div class="user-greeting">
        <div class="avatar-ring">
          <img
            src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80"
            alt="Sai"
          />
        </div>
        <h1 class="greeting-name">Hello, Sai</h1>
      </div>

      <div class="header-actions-pill">
        <button class="header-pill-btn" id="notifBtn" aria-label="Notifications">
          <span class="notif-dot"></span>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
        <button class="header-pill-btn" id="menuBtn" aria-label="Menu">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="7" x2="21" y2="7"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="17" x2="21" y2="17"></line>
          </svg>
        </button>
      </div>
    </header>

    <main class="view-panel active" id="view-home">
      <div class="category-pills" id="categoryPills">
        <button class="cat-pill active" data-cat="Movies">Movies</button>
        <button class="cat-pill" data-cat="Sports">Sports</button>
        <button class="cat-pill" data-cat="TV Shows">TV Shows</button>
        <button class="cat-pill" data-cat="News">News</button>
      </div>

      <div class="featured-card" id="featuredCard"></div>

      <section class="section-block">
        <div class="section-title-row">
          <h2 class="section-title" id="railTitle1">Trending Now</h2>
        </div>
        <div class="poster-rail" id="rail1"></div>
      </section>

      <section class="section-block">
        <div class="section-title-row">
          <h2 class="section-title" id="railTitle2">Top Picks For You</h2>
        </div>
        <div class="poster-rail" id="rail2"></div>
      </section>
    </main>

    <section class="view-panel" id="view-search">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="searchInput" placeholder="Search movies, sports, shows, news..." />
      </div>
      <div class="grid-2" id="searchResults"></div>
    </section>

    <section class="view-panel" id="view-saved">
      <div class="section-title-row">
        <h2 class="section-title">Saved Watchlist</h2>
      </div>
      <div class="grid-2" id="savedList"></div>
    </section>

    <section class="view-panel" id="view-profile">
      <div class="profile-card">
        <h2 style="margin:0 0 6px;font-size:19px;">Sai</h2>
        <p style="margin:0;color:var(--text-secondary);font-size:13px;">MOVAI Cinema Member • Ultra HD Ready</p>
      </div>
      <div class="profile-card">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;">
          <span style="color:var(--text-secondary);">Saved Titles</span>
          <strong id="savedCountLabel">0</strong>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:var(--text-secondary);">Playback Quality</span>
          <strong>4K HDR</strong>
        </div>
      </div>
    </section>
  </div>

  <div class="bottom-dock-wrap">
    <nav class="bottom-dock" aria-label="Primary Navigation">
      <button class="dock-btn active" data-tab="home" aria-label="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5z"></path>
        </svg>
        <span>Home</span>
      </button>

      <button class="dock-btn" data-tab="search" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search</span>
      </button>

      <button class="dock-btn" data-tab="saved" aria-label="Saved">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Saved</span>
      </button>

      <button class="dock-btn" data-tab="profile" aria-label="Profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <div class="modal-backdrop" id="playerModal">
    <div class="player-sheet">
      <div class="sheet-handle"></div>
      <div class="player-screen">
        <img id="modalThumb" src="" alt="" />
        <button class="player-center-btn" id="togglePlayBtn" aria-label="Play or Pause">
          <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 4 20 12 6 20 6 4"></polygon>
          </svg>
        </button>
      </div>
      <h3 id="modalTitle" style="margin:0 0 4px;font-size:19px;font-weight:800;"></h3>
      <p id="modalMeta" style="margin:0;font-size:12px;color:var(--text-secondary);"></p>
      <div class="modal-actions">
        <button class="btn-primary" id="modalSaveBtn">Save to List</button>
        <button class="btn-ghost" id="closeModalBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    const CATALOG = [
      { id: 'm1', title: 'Midnight Horizon', cat: 'Movies', year: '2026', rating: '9.1', img: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=900&q=80' },
      { id: 'm2', title: 'Velvet Shadows', cat: 'Movies', year: '2025', rating: '8.8', img: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=700&q=80' },
      { id: 'm3', titl
